```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheng's Family Member List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      text-align: center;
      color: #263858;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .form {
      display: grid;
      grid-template-columns: 1.5fr 90px 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      width: 100%;
      border: 1px solid #ccc;
      min-width: 0;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      background: #263858;
    }

    button:hover {
      opacity: 0.85;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 750px;
    }

    th, td {
      border-bottom: 1px solid #e5e5e5;
      padding: 13px 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      background: #263858;
      color: white;
    }

    tr:nth-child(even) {
      background: #f8f9fb;
    }

    .delete-btn {
      background: #c0392b;
      padding: 8px 10px;
    }

    .clear-btn {
      background: #555;
      margin-top: 15px;
    }

    #message {
      color: #b42318;
      margin: 10px 0;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #777;
      margin-top: 25px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .form {
        grid-template-columns: 1fr 1fr;
      }

      .form button {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 17px;
      }

      .form {
        grid-template-columns: 1fr;
      }

      .form button {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌸CHENG FAMILY🌸</h1>
    <p class="subtitle">Family Member List</p>

    <form class="form" id="memberForm">
      <input
        type="text"
        id="name"
        placeholder="Enter full name"
        maxlength="80"
        required
      >

      <input
        type="number"
        id="age"
        placeholder="Age"
        min="1"
        max="120"
        required
      >

      <input
        type="text"
        id="talent"
        placeholder="Talent"
        maxlength="100"
        required
      >

      <input
        type="text"
        id="hobbies"
        placeholder="Hobbies"
        maxlength="150"
        required
      >

      <button type="submit">Add Member</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>Full Name</th>
            <th>Member</th>
            <th>Age</th>
            <th>Talent</th>
            <th>Hobbies</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="memberTable"></tbody>
      </table>
    </div>

    <button class="clear-btn" id="clearBtn" type="button">
      Clear All Members
    </button>

    <p class="footer">
      🌸Cheng Family🌸
    </p>
  </div>

  <script>
    const form = document.getElementById("memberForm");
    const nameInput = document.getElementById("name");
    const ageInput = document.getElementById("age");
    const talentInput = document.getElementById("talent");
    const hobbiesInput = document.getElementById("hobbies");
    const table = document.getElementById("memberTable");
    const message = document.getElementById("message");
    const clearBtn = document.getElementById("clearBtn");

    let members = [];

    function renderMembers() {
      table.replaceChildren();

      members.forEach((member, index) => {
        const row = document.createElement("tr");

        const values = [
          index + 1,
          member.name,
          "Member " + (index + 1),
          member.age,
          member.talent,
          member.hobbies
        ];

        values.forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-btn";
        deleteButton.type = "button";

        deleteButton.addEventListener("click", () => {
          members.splice(index, 1);
          renderMembers();
          message.textContent = "Family member deleted.";
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);
        table.appendChild(row);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const age = Number(ageInput.value);
      const talent = talentInput.value.trim();
      const hobbies = hobbiesInput.value.trim();

      if (
        !name ||
        !Number.isInteger(age) ||
        age < 1 ||
        age > 120 ||
        !talent ||
        !hobbies
      ) {
        message.textContent =
          "Please enter a valid name, age, talent, and hobbies.";
        return;
      }

      members.push({ name, age, talent, hobbies });
      renderMembers();

      message.style.color = "#16803c";
      message.textContent = "Family member added successfully!";

      form.reset();
      nameInput.focus();
    });

    clearBtn.addEventListener("click", () => {
      if (members.length === 0) {
        message.style.color = "#b42318";
        message.textContent = "The list is already empty.";
        return;
      }

      if (confirm("Are you sure you want to clear all members?")) {
        members = [];
        renderMembers();

        message.style.color = "#16803c";
        message.textContent = "All members have been cleared.";
      }
    });
  </script>
</body>
</html>
